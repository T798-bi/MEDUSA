/* ===== MEDUSA RAINBOW & SPARKLE EFFECTS ===== */

body {
  overflow-x: hidden;
  position: relative;
}

#root {
  position: relative;
  z-index: 1;
}

/* Animated rainbow aurora background */
body::before {
  content: "";
  position: fixed;
  inset: -50%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(0,255,140,.13), transparent 35%),
    radial-gradient(ellipse at 75% 20%, rgba(160,60,255,.13), transparent 35%),
    radial-gradient(ellipse at 50% 80%, rgba(255,40,150,.10), transparent 35%),
    radial-gradient(ellipse at 85% 75%, rgba(30,150,255,.12), transparent 35%);
  filter: blur(35px);
  animation: rainbowAurora 14s ease-in-out infinite alternate;
}

@keyframes rainbowAurora {
  0% { transform: translate(-3%, -2%) rotate(0deg) scale(1); }
  50% { transform: translate(3%, 2%) rotate(8deg) scale(1.08); }
  100% { transform: translate(-2%, 4%) rotate(-8deg) scale(1.04); }
}

/* Sparkling stars */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .65;
  background-image:
    radial-gradient(2px 2px at 10% 20%, white 50%, transparent 100%),
    radial-gradient(2px 2px at 30% 75%, #10ffb0 50%, transparent 100%),
    radial-gradient(2px 2px at 55% 15%, #f1d77a 50%, transparent 100%),
    radial-gradient(3px 3px at 80% 45%, white 50%, transparent 100%),
    radial-gradient(2px 2px at 92% 85%, #c77dff 50%, transparent 100%),
    radial-gradient(2px 2px at 65% 65%, #50c8ff 50%, transparent 100%),
    radial-gradient(2px 2px at 18% 90%, #ff70c5 50%, transparent 100%);
  background-size: 350px 350px;
  animation: sparkleMove 18s linear infinite,
             sparkleBlink 3s ease-in-out infinite alternate;
}

@keyframes sparkleMove {
  from { background-position: 0 0; }
  to { background-position: 350px 350px; }
}

@keyframes sparkleBlink {
  from { opacity: .2; }
  to { opacity: .8; }
}

/* Welcome section */
.hero {
  position: relative;
  isolation: isolate;
}

.hero h1 {
  animation: titleReveal 1.2s ease both;
  text-shadow: 0 0 35px rgba(16,160,112,.2);
}

.hero p {
  animation: fadeUp 1.5s ease both;
}

/* Rainbow glow on main heading */
.hero h1 {
  background: linear-gradient(
    90deg,
    #ffffff,
    #10d890,
    #55caff,
    #c77dff,
    #f1d77a,
    #ffffff
  );
  background-size: 300% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: titleReveal 1.2s ease both,
             rainbowText 8s linear infinite;
}

@keyframes rainbowText {
  to { background-position: 300% center; }
}

@keyframes titleReveal {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Glass cards */
.glass {
  transition: border-color .35s ease,
              transform .35s ease,
              box-shadow .35s ease;
}

.glass:hover {
  border-color: rgba(16,160,112,.45);
  box-shadow: 0 0 30px rgba(16,160,112,.10);
  transform: translateY(-3px);
}

/* Buttons */
.btn {
  transition: transform .3s ease,
              box-shadow .3s ease,
              filter .3s ease;
}

.btn:hover {
  transform: translateY(-3px) scale(1.03);
  filter: brightness(1.1);
  box-shadow: 0 0 22px rgba(212,175,55,.35);
}

.btn:active {
  transform: scale(.96);
}

/* Welcome page entrance */
.welcome-mode main {
  animation: pageEnter 1s ease both;
}

@keyframes pageEnter {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Respect reduced-motion preferences */
@media (prefers-reduced-motion: reduce) {
  body::before,
  body::after,
  .hero h1,
  .hero p,
  .welcome-mode main {
    animation: none !important;
  }

  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }
}

function $(selector) {

// Safely display text inside HTML
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

// Format file sizes
function fmt(bytes) {
  if (!Number.isFinite(Number(bytes))) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB'];
  let size = Number(bytes);
  let index = 0;

  while (size >= 1024 && index < units.length - 1) {
    size /= 1024;
    index++;
  }

  return `${size.toFixed(index === 0 ? 0 : 2)} ${units[index]}`;
}

// Identify supported file types
function kindOf(file) {
  const type = (file.type || '').toLowerCase();
  const name = (file.name || '').toLowerCase();

  if (type.startsWith('image/') ||
      /\.(jpg|jpeg|png|gif|webp|svg|bmp|avif|ico)$/.test(name)) {
    return 'image';
  }

  if (type.startsWith('video/') ||
      /\.(mp4|webm|mov|m4v|avi|mkv|ogv)$/.test(name)) {
    return 'video';
  }

  if (type.startsWith('audio/') ||
      /\.(mp3|wav|ogg|m4a|aac|flac|opus|wma)$/.test(name)) {
    return 'audio';
  }

  if (
    type.startsWith('application/') ||
    type.startsWith('text/') ||
    /\.(pdf|doc|docx|xls|xlsx|ppt|pptx|txt|csv|zip|rar|7z|json|xml)$/.test(name)
  ) {
    return 'document';
  }

  return null;
}

// Generate a unique file ID
function newId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 3 | 8)).toString(16);
  });
}

// Generate the public MEDUSA viewing link
function linkOf(id) {
  return `${location.origin}${location.pathname}#/view/${encodeURIComponent(id)}`;
}

async function upOne(f) {
  const list = $('#list');
  if (!list) return;

  const el = document.createElement('div');
  el.className = 'row';
  list.prepend(el);

  const kind = kindOf(f);

  if (!kind) {
    el.innerHTML = `<span class="err">Unsupported file type: ${esc(f.name)}</span>`;
    return;
  }

  if (f.size > MAX) {
    el.innerHTML = `<span class="err">File exceeds the 50 MB limit.</span>`;
    return;
  }

  if (f.size === 0) {
    el.innerHTML = `<span class="err">File is empty.</span>`;
    return;
  }

  el.innerHTML = `
    <span class="n">
      ${esc(f.name)}<br>
      <small>${kind} · ${fmt(f.size)}</small>
    </span>
    <button class="btn o s" id="cancel">Cancel</button>
    <div class="bar"><i></i></div>
  `;

  try {
    const { data: { session }, error: sessionError } =
      await sb.auth.getSession();

    if (sessionError || !session) {
      throw new Error('Please sign in again before uploading.');
    }

    const id = newId();
    const path = `${user.id}/${id}-${f.name.replace(/[^\w.\-]/g, '_')}`;

    const x = new XMLHttpRequest();

    x.open(
      'POST',
      `${SB_URL}/storage/v1/object/${BUCKET}/${path}`
    );

    x.setRequestHeader('Authorization', 'Bearer ' + session.access_token);
    x.setRequestHeader('apikey', SB_KEY);
    x.setRequestHeader('x-upsert', 'false');
    x.setRequestHeader('Content-Type', f.type || 'application/octet-stream');

    x.upload.onprogress = e => {
      if (e.lengthComputable) {
        el.querySelector('.bar i').style.width =
          (e.loaded / e.total * 100) + '%';
      }
    };

    el.querySelector('#cancel').onclick = () => x.abort();

    x.onabort = () => {
      el.querySelector('.bar')?.remove();
      el.querySelector('#cancel')?.remove();
      el.insertAdjacentHTML('beforeend',
        '<span class="err">Cancelled</span>');
    };

    x.onerror = () => {
      el.querySelector('.bar')?.remove();
      el.insertAdjacentHTML('beforeend',
        '<span class="err">Network error</span>');
    };

    x.onload = async () => {
      if (x.status > 299) {
        let message = 'Upload rejected by server.';
        try {
          message = JSON.parse(x.responseText).message || message;
        } catch {}
        el.querySelector('.bar')?.remove();
        el.querySelector('#cancel')?.remove();
        el.insertAdjacentHTML('beforeend',
          `<span class="err">Upload failed: ${esc(message)}</span>`);
        return;
      }

      const { error } = await sb.from('files').insert({
        id,
        owner: user.id,
        name: f.name,
        kind,
        mime: f.type || null,
        size: f.size,
        path
      });

      if (error) {
        await sb.storage.from(BUCKET).remove([path]);
        el.querySelector('.bar')?.remove();
        el.querySelector('#cancel')?.remove();
        el.insertAdjacentHTML('beforeend',
          `<span class="err">Database error: ${esc(error.message)}</span>`);
        return;
      }

      const url = linkOf(id);

      el.innerHTML = `
        <span class="n">
          ${esc(f.name)}<br>
          <small>${kind} · ${fmt(f.size)}</small><br>
          <a class="ok" href="${url}">${url}</a>
        </span>
        <button class="btn s" data-copy>Copy Link</button>
        <a class="btn o s" href="${url}" target="_blank">Open</a>
        <button class="btn o s" data-share>Share</button>
      `;

      el.querySelector('[data-copy]').onclick = async () => {
        await navigator.clipboard.writeText(url);
        el.querySelector('[data-copy]').textContent = 'Copied ✓';
      };

      el.querySelector('[data-share]').onclick = () => {
        if (navigator.share) {
          navigator.share({ title: f.name, url }).catch(() => {});
        } else {
          navigator.clipboard.writeText(url);
        }
      };
    };

    x.send(f);

  } catch (error) {
    el.querySelector('.bar')?.remove();
    el.querySelector('#cancel')?.remove();
    el.insertAdjacentHTML('beforeend',
      `<span class="err">${esc(error.message)}</span>`);
  }
}

  </div></div>`;
  console.error('MEDUSA signed URL failed:',signedError);
  return;
 }

 const u=s.signedUrl;

 // Generate download URL only when downloads are enabled
 let sd=null;

 if(f.allow_download){
  const downloadResult=await sb.storage
   .from(BUCKET)
   .createSignedUrl(f.path,3600,{download:f.name});

  if(downloadResult.error){
   console.error('MEDUSA download URL error:',downloadResult.error);
  }else{
   sd=downloadResult.data;
  }
 }

 // Prepare the content preview
 let body='';

 if(f.kind==='image'){
  body=`<img src="${u}" alt="${esc(f.name)}" id="im">`;

 }else if(f.kind==='video'){
  body=`<video src="${u}" controls playsinline preload="metadata"></video>`;

 }else if(f.kind==='audio'){
  body=`<div class="aud" id="au">
  <div class="disc"></div>
  <h3>${esc(f.name)}</h3>
  <audio src="${u}" controls preload="metadata"></audio>
  </div>`;

 }else if(f.name.toLowerCase().endsWith('.pdf')){
  body=`<iframe id="pf" title="${esc(f.name)}"></iframe>`;

 }else if(f.name.toLowerCase().endsWith('.txt')){
  body=`<pre id="tx" style="white-space:pre-wrap;max-width:900px;width:100%" class="glass">Loading text file...</pre>`;

 }else{
  body=`<div class="glass" style="text-align:center">
  <h3>${esc(f.name)}</h3>
  <p style="color:var(--mut);margin:10px 0">
  In-browser preview isn't available for this format.
  </p>
  ${sd?'':'<p class="err">Downloads are unavailable.</p>'}
  </div>`;
 }

 // Display the file page
 root.innerHTML=`<div class="view">
 ${head}
 <div class="stage">${body}</div>
 <footer>${esc(f.name)} · ${fmt(f.size)} · By TYMSTAR</footer>
 </div>`;

 // Share button
 $('#sh').onclick=()=>{
  if(navigator.share){
   navigator.share({title:f.name,url:location.href});
  }else{
   navigator.clipboard.writeText(location.href);
   $('#sh').textContent='Link copied ✓';
  }
 };

 // Download button
 if(sd){
  $('#dl').innerHTML=`<a class="btn s" href="${sd.signedUrl}">Download</a>`;
 }

 // Image zoom
 if($('#im')){
  $('#im').onclick=e=>e.target.classList.toggle('z');
  $('#im').ondblclick=e=>e.target.requestFullscreen?.();
 }

 // Audio animation
 if($('#au')){
  const a=$('#au audio');
  a.onplay=()=>$('#au').classList.add('p');
  a.onpause=a.onended=()=>$('#au').classList.remove('p');
 }

 // Display TXT files
 if($('#tx')){
  fetch(u)
   .then(r=>{
    if(!r.ok)throw new Error('Could not retrieve the text file.');
    return r.text();
   })
   .then(t=>$('#tx').textContent=t)
   .catch(e=>$('#tx').textContent=e.message);
 }

 // Display PDF files
 if($('#pf')){
  fetch(u)
   .then(r=>{
    if(!r.ok)throw new Error('Could not retrieve the PDF.');
    return r.blob();
   })
   .then(b=>{
    const pdfURL=URL.createObjectURL(
     new Blob([b],{type:'application/pdf'})
    );
    $('#pf').src=pdfURL+'#toolbar=1';
   })
   .catch(e=>{
    console.error('MEDUSA PDF error:',e);
    $('#pf').outerHTML=
     `<p class="err">${esc(e.message)}</p>`;
   });
 }
}


// ---------- Auth ----------
function auth(){
 let mode='in';
 const draw=()=>{shell(`<div class="glass" style="max-width:400px;margin:40px auto"><h2>${mode==='in'?'Sign in':'Create account'}</h2>
 <div style="display:grid;gap:12px"><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (min 8 chars)" autocomplete="${mode==='in'?'current-password':'new-password'}">
 <button class="btn" id="go">${mode==='in'?'Sign in':'Sign up'}</button><a href="#" id="sw" style="color:var(--gold);font-size:13px">${mode==='in'?'No account? Create one':'Have an account? Sign in'}</a><div id="m" class="err"></div></div></div>`);
 $('#sw').onclick=e=>{e.preventDefault();mode=mode==='in'?'up':'in';draw()};
 $('#go').onclick=async()=>{const em=$('#em').value.trim(),pw=$('#pw').value;
  const r=mode==='in'?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw});
  if(r.error){$('#m').textContent=r.error.message;return}
  if(mode==='up'&&!r.data.session){$('#m').className='ok';$('#m').textContent='Check your email to confirm your account, then sign in.';return}
  await loadUser();location.hash='#/dashboard'}};
 draw();
}

// ---------- Dashboard ----------
async function dashboard(){
 if(!user){location.hash='#/auth';return}
 shell('<p>Loading…</p>');
const {data:result,error}=await sb
  .from('files')
  .select('*')
  .eq('owner',user.id)
  .order('created_at',{ascending:false});

if(error){
  shell(`
    <div class="glass">
      <h2>Dashboard could not load</h2>
      <p class="err">${esc(error.message)}</p>
      <button class="btn" onclick="location.reload()">Try Again</button>
    </div>
  `);
  console.error('MEDUSA dashboard error:',error);
  return;
}

const files = result || [];
 let q='',k='all';
 const draw=()=>{
  const used=files.reduce((a,f)=>a+f.size,0), views=files.reduce((a,f)=>a+f.views,0);
  const list=files.filter(f=>(k==='all'||f.kind===k)&&f.name.toLowerCase().includes(q));
  shell(`<h2>Dashboard</h2><div class="grid">
  <div class="glass stat"><b>${files.length}</b><span>Total files uploaded</span></div>
  <div class="glass stat"><b>${fmt(used)}</b><span>Storage used</span></div>
  <div class="glass stat"><b>${files.length}</b><span>Links generated</span></div>
  <div class="glass stat"><b>${views}</b><span>Total views</span></div></div>
  <div class="tools"><input id="q" placeholder="Search your files" value="${esc(q)}"><select id="k">${['all','image','video','document','audio'].map(x=>`<option ${x===k?'selected':''}>${x}</option>`).join('')}</select><a class="btn" href="#/">Upload</a></div>
  <div class="glass">${list.map(f=>`<div class="row" data-id="${f.id}"><span class="n">${esc(f.name)}<br><small>${f.kind} · ${fmt(f.size)} · ${new Date(f.created_at).toLocaleDateString()} · ${f.views} views${f.expires_at?' · expires '+new Date(f.expires_at).toLocaleDateString():''}</small></span>
   <span class="tag">${f.active&&f.is_public?'Live':'Disabled'}</span>
   <button class="btn s" data-a="copy">Copy</button><a class="btn o s" href="#/view/${f.id}" target="_blank">Open</a>
   <button class="btn o s" data-a="ren">Rename</button><button class="btn o s" data-a="tog">${f.active?'Disable':'Enable'}</button>
   <button class="btn o s" data-a="dl">Downloads ${f.allow_download?'on':'off'}</button><button class="btn o s" data-a="exp">Expiry</button><button class="btn d s" data-a="del">Delete</button></div>`).join('')||'<p style="color:var(--mut)">No files found.</p>'}</div>`);
  $('#q').oninput=e=>{q=e.target.value.toLowerCase();draw();$('#q').focus();$('#q').setSelectionRange(99,99)};
  $('#k').onchange=e=>{k=e.target.value;draw()};
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
   const id=b.closest('.row').dataset.id,f=files.find(x=>x.id===id),a=b.dataset.a;let patch=null;
   if(a==='copy'){navigator.clipboard.writeText(linkOf(id));b.textContent='Copied ✓';return}
   if(a==='ren'){const n=prompt('New name',f.name);if(n&&n.trim())patch={name:n.trim()}}
   if(a==='tog')patch={active:!f.active};
   if(a==='dl')patch={allow_download:!f.allow_download};
   if(a==='exp'){const d=prompt('Expire after how many days? (blank = never)','');if(d!==null)patch={expires_at:d.trim()?new Date(Date.now()+d*864e5).toISOString():null}}
   if(a==='del'&&confirm('Delete this file and revoke its link permanently?')){
    const r=await sb.storage.from(BUCKET).remove([f.path]);if(r.error)return alert(r.error.message);
    const {error}=await sb.from('files').delete().eq('id',id);if(error)return alert(error.message);
    files.splice(files.indexOf(f),1);draw();return}
   if(patch){const {error}=await sb.from('files').update(patch).eq('id',id);if(error)return alert(error.message);Object.assign(f,patch);draw()}
  });
 };
 draw();
}

// ---------- Admin ----------
async function admin(){
 if(role!=='admin'){location.hash='#/';return}
 const {data:s,error}=await sb.rpc('admin_stats');
 if(error){shell(`<p class="err">${esc(error.message)}</p>`);return}
 shell(`<h2>Admin</h2><div class="grid">${[['Users',s.users],['Files',s.files],['Links',s.files],['Storage',fmt(s.storage)],['Views',s.views],['Active links',s.active],['Inactive links',s.inactive]].map(([a,b])=>`<div class="glass stat"><b>${b}</b><span>${a}</span></div>`).join('')}</div>
 <h3>Recent uploads</h3><div class="glass">${s.recent.map(f=>`<div class="row"><span class="n">${esc(f.name)}<br><small>${f.kind} · ${fmt(f.size)} · ${new Date(f.created_at).toLocaleString()}</small></span><a class="btn o s" href="#/view/${f.id}" target="_blank">Open</a></div>`).join('')}</div>`);
}

// ---------- Static pages ----------
const about=()=>shell(`<div class="glass"><h2>About MEDUSA</h2><p style="line-height:1.7;color:var(--mut)">MEDUSA is a modern file-hosting and content-sharing platform built to make sharing digital content easier, faster and more accessible. From images and videos to documents and music, MEDUSA transforms uploaded files into unique links that can be opened and accessed through a dedicated viewing experience.<br><br>Built with simplicity, speed and accessibility in mind, MEDUSA provides a smarter way to store, manage and share digital content.<br><br>Created and powered by TYMSTAR.</p>
<h2 style="margin-top:24px">Our Mission</h2><p style="line-height:1.7;color:var(--mut)">Our mission is to simplify digital sharing by giving everyone a reliable way to transform files into accessible links without unnecessary complications.</p></div>`);
const page=n=>shell(`<div class="glass"><h2>${{privacy:'Privacy Policy',terms:'Terms of Service',contact:'Contact'}[n]||'Page'}</h2><p style="color:var(--mut);line-height:1.7">Replace this text with your own ${n} content before launch.</p></div>`);

async function route(){
 await loadUser();
 const h=location.hash.slice(1)||'/', [,a,b]=h.split('/');
 if(a==='view'&&b)return viewer(b);
 ({'':home,about,auth,dashboard,admin}[a||''] ? ({'':home,about,auth,dashboard,admin}[a||''])() : a==='page'?page(b):home());
 window.scrollTo(0,0);
}
function setup(){
 root.innerHTML=`<main><div class="glass" style="max-width:480px;margin:60px auto"><h2>Connect Supabase</h2>
 <p style="color:var(--mut);font-size:13px;line-height:1.6;margin-bottom:14px">Enter your project URL and anon (public) key from Supabase → Project Settings → API. Never paste the service-role key.</p>
 <div style="display:grid;gap:12px"><input id="su" placeholder="https://xxxx.supabase.co"><input id="sk" placeholder="anon public key"><button class="btn" id="ss">Save &amp; continue</button><div id="sm" class="err"></div></div></div></main>`;
 $('#ss').onclick=()=>{
  const url=$('#su').value.trim().replace(/\/+$/,''),key=$('#sk').value.trim();
  if(!/^https?:\/\/.+/.test(url)||key.length<20){$('#sm').textContent='Enter a valid project URL and anon key.';return}
  try{if(JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role==='service_role'){$('#sm').textContent='That is a service-role key. Use the anon key instead.';return}}catch{}
  localStorage.setItem('medusa_cfg',JSON.stringify({url,key}));location.reload();
 };
}
// ===== START MEDUSA =====
addEventListener('hashchange',route);
route();
</script>
